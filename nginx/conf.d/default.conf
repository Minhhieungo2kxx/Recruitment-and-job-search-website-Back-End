
# WebSocket connection mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Preserve original protocol from ngrok
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Determine original port
map $forwarded_proto $forwarded_port {
    https   443;
    http    80;
    default 80;
}

# Spring Boot upstream
upstream springboot_backend {
    server recruitmentjob:8081;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    client_body_timeout 120s;
    client_header_timeout 120s;
    send_timeout 120s;

    # Reverse proxy
    location / {
        proxy_pass http://springboot_backend;
        proxy_http_version 1.1;

        # Original client information
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Forwarded protocol and host
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $forwarded_port;

        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts
        proxy_connect_timeout 20s;
        proxy_send_timeout 60s;
        proxy_read_timeout 3600s;

        # SSE
        proxy_buffering off;
    }

    # Nginx health check
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    # Temporary proxy debug
    location = /proxy-debug {
        default_type text/plain;

        return 200 "scheme=$scheme, forwarded_proto=$http_x_forwarded_proto, forwarded_host=$http_x_forwarded_host, forwarded_port=$http_x_forwarded_port";
    }
}
